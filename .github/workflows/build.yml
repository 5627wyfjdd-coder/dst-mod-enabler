name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Fix Smart Quotes (iOS issue)
        run: |
          sed -i '' 's/“/"/g' Tweak.x
          sed -i '' 's/”/"/g' Tweak.x
          sed -i '' "s/‘/'/g" Tweak.x
          sed -i '' "s/’/'/g" Tweak.x

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DSTModEnabler-dylib
          path: .theos/obj/**/*.dylib
