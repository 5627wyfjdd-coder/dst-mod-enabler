name: Build DSTMods

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /Users/runner/theos

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Install Dependencies
        run: |
          brew update
          brew install ldid make dpkg

      - name: Build
        run: |
          export THEOS=$THEOS
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DSTMods-DEB
          path: packages/*.deb

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: DSTMods-Dylib
          path: |
            .theos/_/Library/MobileSubstrate/DynamicLibraries/DSTMods.dylib
            .theos/_/Library/MobileSubstrate/DynamicLibraries/DSTMods.plist
